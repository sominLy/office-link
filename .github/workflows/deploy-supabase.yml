# Supabase 배포 — 마이그레이션 적용 + push-notify 함수 재배포
#
# 실행: GitHub → Actions → "Deploy to Supabase" → Run workflow
#   migrations      적용할 번호를 띄어쓰기로 (예: 024 025). 비우면 건너뛴다.
#   deploy_function push-notify를 다시 배포할지 (기본 켜짐). Verify JWT는 끈 채 배포한다 — 크론이 토큰 없이 부른다.
#
# 필요한 비밀값: SUPABASE_ACCESS_TOKEN (저장소 Settings → Secrets and variables → Actions)
#   supabase.com → Account → Access Tokens에서 만든 개인 토큰. DB 비밀번호는 필요 없다.
#
# 마이그레이션은 대시보드 SQL Editor의 Run과 같은 방식(Management API)으로 파일 전체를 한 번에 실행한다.
# 저장소의 마이그레이션은 전부 여러 번 실행해도 안전하게 쓰여 있어서, 이미 적용한 번호를 다시 넣어도 된다.
# 적용 뒤에는 supabase/queries/launch_check.sql을 돌려 ❌ 줄을 실행 요약에 경고로 띄운다.
name: "Deploy to Supabase"

on:
  workflow_dispatch:
    inputs:
      migrations:
        description: "적용할 마이그레이션 번호 (띄어쓰기로, 예: 024 025). 비우면 건너뜀"
        required: false
        default: ""
        type: string
      deploy_function:
        description: "push-notify 함수 재배포"
        required: false
        default: true
        type: boolean

concurrency: deploy-supabase

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ykyocsatvnqbuwvybirw
      MIGRATIONS: ${{ inputs.migrations }}
    steps:
      - uses: actions/checkout@v4

      - name: "비밀값 확인"
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error title=SUPABASE_ACCESS_TOKEN이 없어요::저장소 Settings → Secrets and variables → Actions에 추가하세요 (supabase.com → Account → Access Tokens)"
            exit 1
          fi

      - name: "마이그레이션 적용"
        if: ${{ inputs.migrations != '' }}
        shell: bash
        run: |
          # 번호만 받는다 (입력창에 다른 글자가 섞이면 멈춘다)
          if ! printf '%s' "$MIGRATIONS" | grep -Eq '^[0-9]{3}( [0-9]{3})*$'; then
            echo "::error title=migrations 입력이 이상해요::세 자리 번호를 띄어쓰기로 적어 주세요 (예: 024 025)"
            exit 1
          fi
          for n in $MIGRATIONS; do
            f=$(ls supabase/migrations/${n}_*.sql)
            echo "▶ $f"
            python3 supabase/scripts/mgmt_sql.py apply "$f"
          done

      - name: "공개 전 점검 (launch_check)"
        if: ${{ inputs.migrations != '' }}
        shell: bash
        run: python3 supabase/scripts/mgmt_sql.py check supabase/queries/launch_check.sql

      - uses: supabase/setup-cli@v1
        if: ${{ inputs.deploy_function }}
        with:
          version: latest

      - name: "push-notify 재배포 (Verify JWT 끔)"
        if: ${{ inputs.deploy_function }}
        shell: bash
        run: supabase functions deploy push-notify --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
